<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Viewer</title>
<style>
video { width: 100%; background: black; }
body { margin: 20px; font-family: Arial; }
</style>
</head>
<body>

<h2>Viewing Screen</h2>
<video id="remote" autoplay playsinline></video>

<script>
function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
}

const room = getParam("room");
if (!room) {
    document.body.innerHTML = "No room code!";
    throw new Error("No room id");
}

let pc = new RTCPeerConnection();
pc.ontrack = event => {
    document.getElementById("remote").srcObject = event.streams[0];
};

(async () => {
    // get broadcaster offer
    const r = await fetch(`/room/${room}`);
    const data = await r.json();
    if (data.error) {
        alert("Room not found");
        return;
    }

    await pc.setRemoteDescription({ type: "offer", sdp: data.offer });

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    // send viewer answer
    await fetch(`/room/${room}/answer`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ sdp: answer.sdp })
    });
})();
</script>

</body>
</html>
